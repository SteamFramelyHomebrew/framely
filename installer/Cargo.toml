[package]
name = "framely-installer"
version = "0.4.1-preview.5"
edition = "2024"
license = "AGPL-3.0-only"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit"]
visual-test = ["desktop", "gpui-kit/test-support"]

[[bin]]
name = "framely-installer"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1"
base64 = "0.22"
gpui-kit = { version = "=0.7.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2.12", features = ["json"] }
url = "2"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
if-addrs = "0.13"
dns-lookup = "2"
mdns-sd = "0.13"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
tempfile = "3"
zeroize = "1"
directories = "6"

[build-dependencies]
winresource = "=0.1.31"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0
